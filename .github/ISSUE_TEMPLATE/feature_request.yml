name: Feature request
description: Suggest a change to Flowboard.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like and any alternatives you have tried.
    validations:
      required: true
